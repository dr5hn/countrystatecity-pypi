[build-system]
requires = [
    "setuptools>=75.3.4; python_version < '3.9'",
    "setuptools>=82.0.1; python_version >= '3.9' and python_version < '3.10'",
    "setuptools>=84.0.0; python_version >= '3.10'",
    # Preserve runtime metadata serialization in wheels built on Python 3.8.
    "wheel>=0.45.1; python_version < '3.9'"
]
build-backend = "setuptools.build_meta"

[project]
name = "countrystatecity-timezones"
version = "2.0.1"
description = "Type-safe offline data for 432 IANA timezones, with country associations, GMT offsets, and conversion utilities."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "dr5hn", email = "support@countrystatecity.in"}
]
maintainers = [
    {name = "dr5hn", email = "support@countrystatecity.in"}
]
license = {file = "LICENSE"}
keywords = [
    "timezones",
    "timezone",
    "countries",
    "geography",
    "iana",
    "utc",
    "gmt",
    "time-conversion",
    "lazy-loading",
    "type-hints",
    "pydantic"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "backports.zoneinfo; python_version < '3.9'"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5; python_version < '3.9'",
    "pytest>=8.4.2; python_version >= '3.9' and python_version < '3.10'",
    "pytest>=9.1.1; python_version >= '3.10'",
    "pytest-cov>=5.0.0; python_version < '3.9'",
    "pytest-cov>=7.1.0; python_version >= '3.9'",
    "mypy>=1.14.1; python_version < '3.9'",
    "mypy>=1.19.1; python_version >= '3.9' and python_version < '3.10'",
    "mypy>=2.4.0; python_version >= '3.10'",
    "black>=24.8.0; python_version < '3.9'",
    "black>=25.11.0; python_version >= '3.9' and python_version < '3.10'",
    "black>=26.10.1; python_version >= '3.10'",
    "isort>=5.13.2; python_version < '3.9'",
    "isort>=6.1.0; python_version >= '3.9' and python_version < '3.10'",
    "isort>=9.0.2; python_version >= '3.10'",
    "ruff>=0.17.0"
]

[project.urls]
Homepage = "https://countrystatecity.in/?utm_source=pypi&utm_medium=project_link&utm_campaign=python_packages&utm_content=timezones"
Documentation = "https://github.com/dr5hn/countrystatecity-pypi/tree/main/python/packages/timezones"
Repository = "https://github.com/dr5hn/countrystatecity-pypi"
Source = "https://github.com/dr5hn/countrystatecity-pypi/tree/main/python/packages/timezones"
Issues = "https://github.com/dr5hn/countrystatecity-pypi/issues"
Changelog = "https://github.com/dr5hn/countrystatecity-pypi/blob/main/python/packages/timezones/CHANGELOG.md"
"Get API Key" = "https://app.countrystatecity.in/?utm_source=pypi&utm_medium=project_link&utm_campaign=python_packages&utm_content=timezones"
"Production API" = "https://docs.countrystatecity.in/api/introduction"
Pricing = "https://countrystatecity.in/pricing/?utm_source=pypi&utm_medium=project_link&utm_campaign=python_packages&utm_content=timezones"

[tool.setuptools.packages.find]
where = ["."]
include = ["countrystatecity_timezones*"]

[tool.setuptools.package-data]
countrystatecity_timezones = ["data/**/*.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=countrystatecity_timezones --cov-report=term-missing"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "countrystatecity_timezones.api"
warn_unused_ignores = false

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N815"]
