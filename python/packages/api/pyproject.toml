[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "countrystatecity-api"
version = "0.2.1"
description = "Official Python client for the Country State City API — typed sync and async access to countries, states, cities, regions, timezones, currencies, dial codes, ISO codes, and fuzzy search."
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    {name = "dr5hn", email = "support@countrystatecity.in"}
]
maintainers = [
    {name = "dr5hn", email = "support@countrystatecity.in"}
]
# setuptools deprecates this table in favour of the PEP 639 pair
# `license = "ODbL-1.0"` + `license-files = ["LICENSE"]` (removal announced for
# 2027-Feb-18). That spelling needs setuptools>=77, and setuptools 77 raised its
# own floor to Python >=3.9 -- so adopting it would break an sdist install on
# 3.8, which `requires-python = ">=3.8"` below still promises. Commit daba47c
# reverted exactly this change on the data packages for the same reason. Switch
# every package together when 3.8 is dropped.
license = {file = "LICENSE"}
keywords = [
    "countrystatecity",
    "api-client",
    "sdk",
    "countries",
    "states",
    "cities",
    "geography",
    "geolocation",
    "timezones",
    "currencies",
    "iso-3166",
    "async",
    "httpx",
    "type-hints"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.24.0,<1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.0.0",
    "black>=23.0.0",
    "isort>=5.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://countrystatecity.in/?utm_source=pypi&utm_medium=project_link&utm_campaign=python_packages&utm_content=api_client"
Documentation = "https://docs.countrystatecity.in/api/introduction"
Repository = "https://github.com/dr5hn/countrystatecity-pypi"
Source = "https://github.com/dr5hn/countrystatecity-pypi/tree/main/python/packages/api"
Issues = "https://github.com/dr5hn/countrystatecity-pypi/issues"
Changelog = "https://github.com/dr5hn/countrystatecity-pypi/blob/main/python/packages/api/CHANGELOG.md"
"Get API Key" = "https://app.countrystatecity.in/?utm_source=pypi&utm_medium=project_link&utm_campaign=python_packages&utm_content=api_client"
"API Playground" = "https://playground.countrystatecity.in/"
Pricing = "https://countrystatecity.in/pricing/?utm_source=pypi&utm_medium=project_link&utm_campaign=python_packages&utm_content=api_client"
"Migration Guide" = "https://github.com/dr5hn/countrystatecity-pypi/blob/main/docs/MIGRATING_TO_API.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["countrystatecity*"]

[tool.setuptools.package-data]
countrystatecity = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=countrystatecity --cov-report=term-missing"

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["N815"]
