name: Python Package CI

on:
  push:
    branches: [main, master]
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/python-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
        package: [countries, timezones, currencies, translations]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: python/packages/${{ matrix.package }}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: python/packages/${{ matrix.package }}
        run: |
          pytest --cov=countrystatecity_${{ matrix.package }} --cov-report=xml --cov-report=term

      - name: Type check with mypy
        working-directory: python/packages/${{ matrix.package }}
        run: |
          mypy countrystatecity_${{ matrix.package }}/ --strict

      - name: Lint with ruff
        working-directory: python/packages/${{ matrix.package }}
        run: |
          ruff check countrystatecity_${{ matrix.package }}/ tests/

      - name: Check code formatting with black
        working-directory: python/packages/${{ matrix.package }}
        run: |
          black --check countrystatecity_${{ matrix.package }}/ tests/

      - name: Check import sorting with isort
        working-directory: python/packages/${{ matrix.package }}
        run: |
          isort --check countrystatecity_${{ matrix.package }}/ tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./python/packages/${{ matrix.package }}/coverage.xml
          flags: unittests
          name: codecov-${{ matrix.package }}
          fail_ci_if_error: false
