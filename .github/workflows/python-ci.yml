name: Python Package CI

on:
  push:
    branches: [main, master]
    paths:
      - 'python/**'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '.github/scripts/**'
      - '.github/requirements/**'
  pull_request:
    paths:
      - 'python/**'
      - '.github/workflows/**'
      - '.github/tests/**'
      - '.github/scripts/**'
      - '.github/requirements/**'

permissions:
  contents: read

jobs:
  workflow-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Check release and publish gates
        run: python -m unittest discover -s .github/tests -v

  test:
    # 2026-10-29: No 3.8/3.9 builds on 26.04; remove pin when support is dropped.
    runs-on: ${{ (matrix.python-version == '3.8' || matrix.python-version == '3.9') && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        # Directory names under python/packages. The distribution and import
        # names are read from each package's pyproject.toml rather than derived
        # from this value: the offline data packages import as
        # countrystatecity_<dir>, while the API client (dir "api") imports as
        # the bare "countrystatecity" namespace.
        package: [countries, timezones, currencies, translations, phonecodes, regions, postal_codes, api]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve package identity
        id: pkg
        working-directory: python/packages/${{ matrix.package }}
        env:
          PACKAGE_DIR: ${{ matrix.package }}
        run: |
          DIST=$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -z "$DIST" ]; then
            echo "Could not read [project].name from pyproject.toml" >&2
            exit 1
          fi
          if [ "$PACKAGE_DIR" = "api" ]; then
            MODULE="countrystatecity"
          else
            MODULE=$(echo "$DIST" | tr '-' '_')
          fi
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "Resolved $DIST -> import $MODULE"

      - name: Install dependencies
        working-directory: python/packages/${{ matrix.package }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          if [ "$PYTHON_VERSION" = '3.15' ]; then
            python -m pip install --require-hashes --only-binary=:all: -r ../../../.github/requirements/release.txt
            python -m pip install --no-deps --no-build-isolation -e .
          else
            # Compatibility tests intentionally exercise the supported dependency ranges.
            # This read-only job has no publishing credentials or shared release artifacts.
            python -m pip install -e ".[dev]"
          fi

      - name: Run tests
        working-directory: python/packages/${{ matrix.package }}
        run: |
          pytest --cov=${{ steps.pkg.outputs.module }} --cov-report=xml --cov-report=term

      - name: Type check with mypy
        working-directory: python/packages/${{ matrix.package }}
        run: |
          mypy ${{ steps.pkg.outputs.module }}/ --strict

      - name: Lint with ruff
        working-directory: python/packages/${{ matrix.package }}
        run: |
          ruff check ${{ steps.pkg.outputs.module }}/ tests/

      - name: Check code formatting with black
        working-directory: python/packages/${{ matrix.package }}
        run: |
          black --check ${{ steps.pkg.outputs.module }}/ tests/

      - name: Check import sorting with isort
        working-directory: python/packages/${{ matrix.package }}
        run: |
          isort --check ${{ steps.pkg.outputs.module }}/ tests/

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.15'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          files: ./python/packages/${{ matrix.package }}/coverage.xml
          flags: ${{ matrix.package }}
          name: codecov-${{ matrix.package }}
          fail_ci_if_error: false

      - name: Build distributions with locked tools
        if: matrix.python-version == '3.15'
        working-directory: python/packages/${{ matrix.package }}
        run: python -m build --no-isolation

      - name: Check distribution contents
        if: matrix.python-version == '3.15'
        env:
          PACKAGE: ${{ matrix.package }}
        run: python .github/scripts/release_artifacts.py check "python/packages/$PACKAGE"
