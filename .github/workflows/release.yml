name: Release

on:
  workflow_dispatch:
    inputs:
      data_update_pr:
        description: 'Merged data-update PR containing the reviewed version and changelog'
        type: string
        required: true
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: prepare-data-release
  cancel-in-progress: false

jobs:
  release:
    name: Validate merged release PR
    if: github.repository == 'dr5hn/countrystatecity-pypi' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'data-update')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.validate.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Validate PR and versions without changing main
        id: validate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.data_update_pr || github.event.pull_request.number }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
          jq -e '.merged == true and .base.ref == "main" and (.labels | any(.name == "data-update"))' "$RUNNER_TEMP/release-pr.json"
          MERGE_SHA=$(jq -r .merge_commit_sha "$RUNNER_TEMP/release-pr.json")
          [ "$MERGE_SHA" = "$(git rev-parse HEAD)" ] || { echo 'Release PR must be the current main tip'; exit 1; }
          python .github/scripts/data_version.py check --base "$MERGE_SHA^1"
          git diff --exit-code
          echo "ref=$MERGE_SHA" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the offline data packages to PyPI
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.ref != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch the top-level trusted-publishing workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ needs.release.outputs.ref }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main -f package=data -f ref="$RELEASE_REF"
