name: Release

on:
  workflow_dispatch:
    inputs:
      data_update_pr:
        description: 'Merged and validated data-update PR to release'
        type: string
        required: true
  pull_request:
    types: [closed]
    branches: [main, master]

# Data-update releases bump the seven offline data packages in lockstep. The
# `api` package (PyPI name `countrystatecity-api`) is deliberately excluded: it
# ships no data, so an upstream data sync does not change it. Version it by
# hand in python/packages/api/pyproject.toml and countrystatecity/_version.py.
# The publish job below is called with `package: data`, the group that names
# exactly those seven, so a data release can never reach the API client even
# if the API version in the tree is ahead of what is on PyPI.
jobs:
  release:
    name: Bump Version & Update Changelog
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'data-update'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      ref: ${{ steps.commit.outputs.ref }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
          fetch-depth: 0

      - name: Verify dispatched data PR
        id: target
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.data_update_pr }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/release-pr.json"
          jq -e '.merged == true and .base.ref == "main" and (.labels | any(.name == "data-update"))' "$RUNNER_TEMP/release-pr.json"
          echo "merge_sha=$(jq -r .merge_commit_sha "$RUNNER_TEMP/release-pr.json")" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install dependencies
        run: |
          for pkg in countries timezones currencies translations phonecodes regions postal_codes; do
            pip install -e "python/packages/$pkg/.[dev]" -q
          done

      - name: Bump patch version for all packages
        id: bump
        env:
          MERGE_SHA: ${{ steps.target.outputs.merge_sha || github.event.pull_request.merge_commit_sha }}
        run: |
          python -c "
          import re, pathlib, subprocess, os

          # Compute new version once from countries (source of truth)
          pyproject = pathlib.Path('python/packages/countries/pyproject.toml')
          content = pyproject.read_text()
          match = re.search(r'version = \"(\d+)\.(\d+)\.(\d+)\"', content)
          major, minor, patch = int(match.group(1)), int(match.group(2)), int(match.group(3))
          new_version = f'{major}.{minor}.{patch + 1}'
          previous = subprocess.check_output(['git', 'show', os.environ['MERGE_SHA'] + '^1:python/packages/countries/pyproject.toml'], text=True)
          previous_version = re.search(r'version = \"(\d+\.\d+\.\d+)\"', previous).group(1)
          if previous_version != f'{major}.{minor}.{patch}':
              if (major, minor, patch) <= tuple(map(int, previous_version.split('.'))):
                  raise ValueError('Release version must increase')
              new_version = f'{major}.{minor}.{patch}'

          # Apply same version to all packages
          for pkg in ['countries', 'timezones', 'currencies', 'translations', 'phonecodes', 'regions', 'postal_codes']:
              pyproject = pathlib.Path(f'python/packages/{pkg}/pyproject.toml')
              content = pyproject.read_text()
              content = re.sub(r'version = \"\d+\.\d+\.\d+\"', f'version = \"{new_version}\"', content)
              pyproject.write_text(content)

              init = pathlib.Path(f'python/packages/{pkg}/countrystatecity_{pkg}/__init__.py')
              init_content = init.read_text()
              init_content = re.sub(r'__version__ = \"\d+\.\d+\.\d+\"', f'__version__ = \"{new_version}\"', init_content)
              init.write_text(init_content)
              print(f'{pkg}: bumped to {new_version}')
          "

          NEW_VERSION=$(python -c "import re, pathlib; m=re.search(r'version = \"(.+?)\"', pathlib.Path('python/packages/countries/pyproject.toml').read_text()); print(m.group(1))")
          echo "new_version=v$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped all packages to v$NEW_VERSION"

      - name: Update CHANGELOGs
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          DATE=$(date +%Y-%m-%d)
          for pkg in countries timezones currencies translations phonecodes regions postal_codes; do
            CHANGELOG="python/packages/$pkg/CHANGELOG.md"
            if grep -Fq "## [${NEW_VERSION#v}]" "$CHANGELOG"; then continue; fi
            ENTRY="## [${NEW_VERSION#v}] - $DATE\n\n### Changed\n- Updated data from upstream database (PR #$PR_NUMBER)\n"
            if [ -f "$CHANGELOG" ]; then
              if grep -q "^## \[" "$CHANGELOG"; then
                sed -i "0,/^## \[/s//$ENTRY\n## [/" "$CHANGELOG"
              else
                printf "\n$ENTRY" >> "$CHANGELOG"
              fi
            fi
          done

      - name: Run tests
        run: |
          for pkg in countries timezones currencies translations phonecodes regions postal_codes; do
            pytest python/packages/$pkg/tests/
          done

      - name: Commit and push
        id: commit
        env:
          NEW_VERSION: ${{ steps.bump.outputs.new_version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            python/packages/countries/pyproject.toml python/packages/countries/countrystatecity_countries/__init__.py python/packages/countries/CHANGELOG.md \
            python/packages/timezones/pyproject.toml python/packages/timezones/countrystatecity_timezones/__init__.py python/packages/timezones/CHANGELOG.md \
            python/packages/currencies/pyproject.toml python/packages/currencies/countrystatecity_currencies/__init__.py python/packages/currencies/CHANGELOG.md \
            python/packages/translations/pyproject.toml python/packages/translations/countrystatecity_translations/__init__.py python/packages/translations/CHANGELOG.md \
            python/packages/phonecodes/pyproject.toml python/packages/phonecodes/countrystatecity_phonecodes/__init__.py python/packages/phonecodes/CHANGELOG.md \
            python/packages/regions/pyproject.toml python/packages/regions/countrystatecity_regions/__init__.py python/packages/regions/CHANGELOG.md \
            python/packages/postal_codes/pyproject.toml python/packages/postal_codes/countrystatecity_postal_codes/__init__.py python/packages/postal_codes/CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${NEW_VERSION} for all packages"
            git push
          fi
          echo "ref=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish the offline data packages to PyPI
    needs: release
    if: needs.release.result == 'success' && needs.release.outputs.ref != ''
    uses: ./.github/workflows/publish.yml
    with:
      package: data
      ref: ${{ needs.release.outputs.ref }}
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
    permissions:
      contents: write
      id-token: write
