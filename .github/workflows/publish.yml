name: Publish to PyPI

on:
  push:
    branches: [main, master]
    paths:
      - 'python/packages/*/pyproject.toml'
      # Offline data packages import as countrystatecity_<name>; the API client
      # imports as the bare countrystatecity namespace.
      - 'python/packages/*/countrystatecity_*/**'
      - 'python/packages/*/countrystatecity/**'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory to publish, or a group (data = the seven offline packages, all = data + api)'
        required: true
        type: choice
        options:
          - countries
          - timezones
          - currencies
          - translations
          - phonecodes
          - regions
          - postal_codes
          - api
          - data
          - all
  workflow_call:
    inputs:
      package:
        description: 'Package directory to publish, or a group: "data" (offline packages only) or "all" (data + api)'
        required: false
        type: string
        default: 'all'
    secrets:
      PYPI_TOKEN:
        required: true

env:
  # Two named groups. `data` is the seven offline snapshot packages, which are
  # versioned in lockstep by an upstream data sync. `all` adds `api`
  # (PyPI name `countrystatecity`), which ships no data and is versioned by
  # hand -- a data-update release must call `data`, never `all`.
  DATA_PACKAGES: '["countries","timezones","currencies","translations","phonecodes","regions","postal_codes"]'
  ALL_PACKAGES: '["countries","timezones","currencies","translations","phonecodes","regions","postal_codes","api"]'

jobs:
  prepare:
    name: Resolve packages to publish
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve package list
        id: resolve
        env:
          INPUT: ${{ inputs.package }}
        run: |
          if [ "$INPUT" = "all" ]; then
            echo "packages=$ALL_PACKAGES" >> $GITHUB_OUTPUT
          elif [ "$INPUT" = "data" ]; then
            echo "packages=$DATA_PACKAGES" >> $GITHUB_OUTPUT
          elif [ -n "$INPUT" ]; then
            echo "packages=[\"$INPUT\"]" >> $GITHUB_OUTPUT
          else
            # Push trigger: only publish packages whose files actually changed
            PKGS=""
            for pkg in countries timezones currencies translations phonecodes regions postal_codes api; do
              if [ "$pkg" = "api" ]; then
                MODULE="countrystatecity"
              else
                MODULE="countrystatecity_$pkg"
              fi
              if git diff --name-only HEAD~1 HEAD -- \
                "python/packages/$pkg/pyproject.toml" \
                "python/packages/$pkg/$MODULE/" | grep -q .; then
                PKGS="${PKGS}\"${pkg}\","
              fi
            done
            PKGS="[${PKGS%,}]"
            if [ "$PKGS" = "[]" ]; then
              PKGS="$ALL_PACKAGES"
            fi
            echo "packages=$PKGS" >> $GITHUB_OUTPUT
          fi

  publish:
    name: Publish ${{ matrix.package }} to PyPI
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    strategy:
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve package identity
        id: pkg
        working-directory: python/packages/${{ matrix.package }}
        run: |
          DIST=$(sed -n 's/^name = "\(.*\)"$/\1/p' pyproject.toml | head -1)
          if [ -z "$DIST" ]; then
            echo "Could not read [project].name from pyproject.toml" >&2
            exit 1
          fi
          MODULE=$(echo "$DIST" | tr '-' '_')
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
          echo "module=$MODULE" >> "$GITHUB_OUTPUT"
          echo "Resolved $DIST -> import $MODULE"

      - name: Install build tools
        run: |
          pip install build twine

      - name: Install dependencies
        working-directory: python/packages/${{ matrix.package }}
        run: |
          pip install -e ".[dev]"

      - name: Run tests
        working-directory: python/packages/${{ matrix.package }}
        run: |
          pytest --cov=${{ steps.pkg.outputs.module }} --cov-report=term

      - name: Type check
        working-directory: python/packages/${{ matrix.package }}
        run: |
          mypy ${{ steps.pkg.outputs.module }}/ --strict

      - name: Lint
        working-directory: python/packages/${{ matrix.package }}
        run: |
          ruff check ${{ steps.pkg.outputs.module }}/ tests/
          black --check ${{ steps.pkg.outputs.module }}/ tests/
          isort --check ${{ steps.pkg.outputs.module }}/ tests/

      - name: Get package version
        id: get-version
        working-directory: python/packages/${{ matrix.package }}
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Package version: $VERSION"

      - name: Check if version already published
        id: check-version
        env:
          PACKAGE_NAME: ${{ steps.pkg.outputs.dist }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          echo "Checking if $PACKAGE_NAME version $VERSION is published..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE_NAME/$VERSION/json")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "published=true" >> $GITHUB_OUTPUT
            echo "Version $VERSION already published to PyPI"
          else
            echo "published=false" >> $GITHUB_OUTPUT
            echo "Version $VERSION not yet published to PyPI (HTTP $HTTP_STATUS)"
          fi

      - name: Build package
        if: steps.check-version.outputs.published == 'false'
        working-directory: python/packages/${{ matrix.package }}
        run: |
          python -m build
          echo "Build artifacts:"
          ls -lh dist/

      - name: Check package with twine
        if: steps.check-version.outputs.published == 'false'
        working-directory: python/packages/${{ matrix.package }}
        run: |
          twine check dist/*

      - name: Publish to PyPI
        if: steps.check-version.outputs.published == 'false'
        working-directory: python/packages/${{ matrix.package }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: |
          twine upload dist/*

      - name: Create GitHub Release
        if: steps.check-version.outputs.published == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.package }}-v${{ steps.get-version.outputs.version }}
          name: ${{ steps.pkg.outputs.dist }} v${{ steps.get-version.outputs.version }}
          body: |
            ## ${{ steps.pkg.outputs.dist }} v${{ steps.get-version.outputs.version }}

            Published to PyPI: https://pypi.org/project/${{ steps.pkg.outputs.dist }}/

            ### Installation
            ```bash
            pip install ${{ steps.pkg.outputs.dist }}
            ```

            See the [README](https://github.com/dr5hn/countrystatecity-pypi/blob/main/python/packages/${{ matrix.package }}/README.md) for full documentation.
          draft: false
          prerelease: false
          files: |
            python/packages/${{ matrix.package }}/dist/*.whl
            python/packages/${{ matrix.package }}/dist/*.tar.gz

      - name: Already published
        if: steps.check-version.outputs.published == 'true'
        run: |
          echo "Version ${{ steps.get-version.outputs.version }} is already published to PyPI. Skipping."
