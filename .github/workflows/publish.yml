name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package directory, data (seven offline packages), or all (including API)'
        required: true
        type: choice
        options: [countries, timezones, currencies, translations, phonecodes, regions, postal_codes, api, data, all]
      ref:
        description: 'Exact 40-character commit on main to build and publish'
        required: true
        type: string

permissions:
  contents: read

# Never cancel an upload or run two releases against the same registry version.
concurrency:
  group: pypi-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'dr5hn/countrystatecity-pypi' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.resolve.outputs.packages }}
      ref: ${{ steps.resolve.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source and package selection
        id: resolve
        env:
          PACKAGE: ${{ inputs.package }}
          SOURCE_REF: ${{ inputs.ref }}
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]] || { echo 'An exact commit is required'; exit 1; }
          [ "$SOURCE_REF" = "$GITHUB_SHA" ] || { echo 'Source must equal the workflow commit for accurate attestations'; exit 1; }
          git merge-base --is-ancestor "$SOURCE_REF" origin/main
          case "$PACKAGE" in
            data) PACKAGES='["countries","timezones","currencies","translations","phonecodes","regions","postal_codes"]' ;;
            all) PACKAGES='["countries","timezones","currencies","translations","phonecodes","regions","postal_codes","api"]' ;;
            countries|timezones|currencies|translations|phonecodes|regions|postal_codes|api) PACKAGES="[\"$PACKAGE\"]" ;;
            *) echo 'Unknown package'; exit 1 ;;
          esac
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "ref=$SOURCE_REF" >> "$GITHUB_OUTPUT"

  build:
    name: Build and test ${{ matrix.package }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - name: Install reviewed release dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/requirements/release.txt
      - name: Install local package without resolving or downloading dependencies
        working-directory: python/packages/${{ matrix.package }}
        run: python -m pip install --no-deps --no-build-isolation -e .
      - name: Validate and build
        working-directory: python/packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          if [ "$PACKAGE" = api ]; then MODULE=countrystatecity; else MODULE="countrystatecity_$PACKAGE"; fi
          pytest --cov="$MODULE" --cov-report=term
          mypy "$MODULE/" --strict
          ruff check "$MODULE/" tests/
          black --check "$MODULE/" tests/
          isort --check "$MODULE/" tests/
          python -m build --no-isolation
      - name: Validate artifact contents
        env:
          PACKAGE: ${{ matrix.package }}
        run: python .github/scripts/release_artifacts.py check "python/packages/$PACKAGE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package }}
          path: python/packages/${{ matrix.package }}/dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ${{ matrix.package }} with trusted publishing
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
    # No checkout, package installation, tests or build hooks in this job.
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - name: Publish with provenance attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          attestations: true
          print-hash: true

  verify:
    name: Verify ${{ matrix.package }} on PyPI
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.15'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - name: Verify live immutable file hashes
        run: python .github/scripts/release_artifacts.py verify dist/

  github-release:
    name: Record verified ${{ matrix.package }} release
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.packages) }}
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: dist-${{ matrix.package }}
          path: dist/
      - name: Create release only after PyPI file verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ matrix.package }}
          SOURCE_REF: ${{ needs.prepare.outputs.ref }}
        run: |
          WHEEL=$(find dist -name '*.whl' -type f)
          VERSION=$(basename "$WHEEL" | cut -d- -f2)
          gh release create "$PACKAGE-v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_REF" --title "$PACKAGE v$VERSION" \
            --notes "Published with PyPI Trusted Publishing and attestations. Both distribution SHA-256 hashes were verified against PyPI before creating this release. Source: $SOURCE_REF" \
            dist/*
