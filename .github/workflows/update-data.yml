name: Update Data

on:
  # Run weekly on Sundays at 00:00 UTC
  schedule:
    - cron: '0 0 * * 0'
  
  # Allow manual trigger
  workflow_dispatch:

jobs:
  update-data:
    name: Update Countries/States/Cities Data
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        working-directory: python/packages/countries
        run: |
          pip install -e ".[dev]"
      
      - name: Download latest data
        run: |
          curl -L "https://github.com/dr5hn/countries-states-cities-database/releases/latest/download/json-countries%2Bstates%2Bcities.json.gz" \
            -o /tmp/countries-data.json.gz
          gunzip /tmp/countries-data.json.gz
          echo "Downloaded data size:"
          ls -lh /tmp/countries-data.json
      
      - name: Backup current data statistics
        run: |
          echo "=== Current Data Statistics ===" > /tmp/data-stats-before.txt
          if [ -f python/packages/countries/countrystatecity_countries/data/countries.json ]; then
            echo "Countries: $(cat python/packages/countries/countrystatecity_countries/data/countries.json | grep -o '"id"' | wc -l)" >> /tmp/data-stats-before.txt
            echo "Data files: $(find python/packages/countries/countrystatecity_countries/data -type f | wc -l)" >> /tmp/data-stats-before.txt
          else
            echo "No existing data found" >> /tmp/data-stats-before.txt
          fi
          cat /tmp/data-stats-before.txt
      
      - name: Generate new data structure
        run: |
          cd python/packages/countries
          python scripts/generate-data.py /tmp/countries-data.json

      - name: Regenerate derived package data
        run: |
          pip install -e "python/packages/countries/.[dev]"
          python python/packages/timezones/scripts/generate-data.py
          python python/packages/currencies/scripts/generate-data.py
          python python/packages/translations/scripts/generate-data.py
          python python/packages/phonecodes/scripts/generate-data.py

      - name: Collect new data statistics
        id: data-stats
        run: |
          COUNTRIES=$(cat python/packages/countries/countrystatecity_countries/data/countries.json | grep -o '"id"' | wc -l)
          TIMEZONES=$(cat python/packages/timezones/countrystatecity_timezones/data/timezones.json | grep -o '"zoneName"' | wc -l)
          CURRENCIES=$(cat python/packages/currencies/countrystatecity_currencies/data/currencies.json | grep -o '"code"' | wc -l)
          TRANSLATIONS=$(cat python/packages/translations/countrystatecity_translations/data/translations.json | grep -o '"lang"' | wc -l)
          PHONECODES=$(cat python/packages/phonecodes/countrystatecity_phonecodes/data/phonecodes.json | grep -o '"phoneCode"' | wc -l)
          echo "countries=$COUNTRIES" >> $GITHUB_OUTPUT
          echo "timezones=$TIMEZONES" >> $GITHUB_OUTPUT
          echo "currencies=$CURRENCIES" >> $GITHUB_OUTPUT
          echo "translations=$TRANSLATIONS" >> $GITHUB_OUTPUT
          echo "phonecodes=$PHONECODES" >> $GITHUB_OUTPUT
          echo "Countries: $COUNTRIES | Timezones: $TIMEZONES | Currencies: $CURRENCIES | Translations: $TRANSLATIONS | Phonecodes: $PHONECODES"

      - name: Run tests with new data
        run: |
          for pkg in countries timezones currencies translations phonecodes; do
            echo "=== Testing $pkg ==="
            pip install -e "python/packages/$pkg/.[dev]" -q
            pytest python/packages/$pkg/tests/ --cov=countrystatecity_$pkg --cov-report=term
          done

      - name: Type check
        run: |
          for pkg in countries timezones currencies translations phonecodes; do
            echo "=== Type checking $pkg ==="
            mypy python/packages/$pkg/countrystatecity_$pkg/ --strict
          done
      
      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Check for data changes
        id: check-changes
        run: |
          if git diff --name-only -- \
            python/packages/countries/countrystatecity_countries/data \
            python/packages/timezones/countrystatecity_timezones/data \
            python/packages/currencies/countrystatecity_currencies/data \
            python/packages/translations/countrystatecity_translations/data \
            python/packages/phonecodes/countrystatecity_phonecodes/data \
            | grep -q .; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Data changes detected"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No data changes detected"
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update countries/states/cities data'
          title: '🔄 Automated Data Update'
          body: |
            ## Automated Data Update

            This PR contains the latest data from [countries-states-cities-database](https://github.com/dr5hn/countries-states-cities-database).

            ### Statistics
            | Package | Records |
            |---|---|
            | countrystatecity-countries | ${{ steps.data-stats.outputs.countries }} countries |
            | countrystatecity-timezones | ${{ steps.data-stats.outputs.timezones }} timezones |
            | countrystatecity-currencies | ${{ steps.data-stats.outputs.currencies }} currencies |
            | countrystatecity-translations | ${{ steps.data-stats.outputs.translations }} translations |
            | countrystatecity-phonecodes | ${{ steps.data-stats.outputs.phonecodes }} phone codes |

            ### Changes
            - Downloaded latest dataset from source repository
            - Regenerated countries/states/cities data structure
            - Regenerated timezones, currencies, and translations derived data
            - All tests passing ✅

            ### Verification
            - ✅ Data generation completed successfully
            - ✅ Type checking passed (mypy strict) for all packages
            - ✅ All tests passing for all packages

            This is an automated pull request. Please review the changes before merging.
          branch: automated-data-update
          delete-branch: true
          labels: |
            automated
            data-update
      
      - name: No changes detected
        if: steps.check-changes.outputs.changed == 'false'
        run: |
          echo "✅ Data is already up to date. No PR created."
